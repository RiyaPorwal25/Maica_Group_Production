{% extends "base.html" %}

{% block title %}Edit Loss Formula{% endblock %}

{% block content %}

<style>
.page-overlay{
background:rgba(0,0,0,0.6);
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:flex;
align-items:center;
justify-content:center;
}

.modal-box{
background:#fff;
width:800px;
padding:25px;
border-radius:10px;
position:relative;
}

.table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

.table th,.table td{
padding:10px;
text-align:center;
border-bottom:1px solid #eee;
}

.table thead{
background:linear-gradient(90deg,#3F2E97,#2c1f6f);
color:#fff;
}

.add-row{
margin-top:10px;
padding:8px 12px;
background:#3F2E97;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
}

.save-btn{
margin-top:15px;
width:100%;
padding:12px;
background:#3F2E97;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}

.delete-btn{
background:#E1251B;
color:#fff;
border:none;
padding:5px 8px;
border-radius:5px;
cursor:pointer;
}

select,input{
padding:6px;
border:1px solid #ccc;
border-radius:5px;
}
.close-btn{
position:absolute;
top:15px;
right:20px;
font-size:22px;
font-weight:bold;
cursor:pointer;
color:#666;
}

.close-btn:hover{
color:#000;
}
</style>

<div class="page-overlay">

<div class="modal-box">
<span class="close-btn" onclick="closeModal()">&times;</span>

<h2>Edit Production Loss Formula</h2>

<form method="POST" id="lossFormulaForm" action="{% url 'edit_loss_formula' %}?id={{ loss.id }}">
{% csrf_token %}
<input type="hidden" name="action" value="save_template">
<input type="hidden" name="form_id" value="{{ loss.id }}">

<table class="table" style="margin-bottom:20px;" id="lossMaterialTable">
<thead>
<tr>
<th>Material</th>
<th>Weight (kg)</th>
<th>Action</th>
</tr>
</thead>
<tbody>
{% for item in loss.items.all %}
<tr>
<td>
<select name="raw_id[]" required>
{% for m in materials %}
<option value="{{ m.id }}" {% if m.id == item.raw_material.id %}selected{% endif %}>{{ m.name }}</option>
{% endfor %}
</select>
</td>
<td>
<input type="number" step="0.01" name="weight[]" value="{{ item.weight }}" required min="0.01">
</td>
<td>
<button type="button" class="delete-btn" onclick="deleteRow(this)">X</button>
</td>
</tr>
{% endfor %}
</tbody>
</table>

<button type="button" class="add-row" onclick="addRow()">+ Add Material</button>

<button type="submit" class="save-btn">Save Loss Formula</button>
</form>

<hr style="margin:25px 0; border-color:#ddd;">

<h3>Add New Loss Entry</h3>

<form method="POST" action="{% url 'edit_loss_formula' %}?id={{ loss.id }}">
{% csrf_token %}
<input type="hidden" name="action" value="create_entry">
<input type="hidden" name="form_id" value="{{ loss.id }}">

<label>Date:</label>
<input type="date" name="date" required>

<label>Batch:</label>
<input type="number" name="batch" value="0" min="0">

<button type="submit" class="save-btn">Create Loss Entry</button>
</form>

<script>
function addRow(){
    const tbody = document.querySelector('#lossMaterialTable tbody');
    const row = document.createElement('tr');
    row.innerHTML = `
        <td>
            <select name="raw_id[]" required>
                {% for m in materials %}
                <option value="{{ m.id }}">{{ m.name }}</option>
                {% endfor %}
            </select>
        </td>
        <td>
            <input type="number" step="0.01" name="weight[]" required min="0.01" value="0.00">
        </td>
        <td>
            <button type="button" class="delete-btn" onclick="deleteRow(this)">X</button>
        </td>
    `;
    tbody.appendChild(row);
}

function deleteRow(button){
    const row = button.closest('tr');
    row.remove();
}
</script>

</div>

</div>

<script>
function closeModal(){
    window.history.back();  
    // OR redirect:
    // window.location.href = "/your-list-page/";
}
</script>

{% endblock %}
