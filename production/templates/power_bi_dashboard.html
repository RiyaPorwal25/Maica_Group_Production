{% extends "base.html" %}
{% load static %}
{% block title %}Power BI Dashboard{% endblock %}
{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
:root {
    --primary: #3F2E97;
    --primary-light: rgba(63, 46, 151, 0.15);
    --primary-dark: #2c1f6f;
    --accent-red: #E1251B;
    --success: #107C41;
    --warning: #F59E0B;
    --info: #3B82F6;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --white: #ffffff;
    
    /* Modernized Soft Shadows */
    --shadow-sm: 0 2px 4px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
    --shadow-hover: 0 20px 25px -5px rgba(0,0,0,0.08), 0 10px 10px -5px rgba(0,0,0,0.04);
    
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Custom Webkit Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

body::before {
    background: rgba(255,255,255,0.35) !important;
    backdrop-filter: blur(1px) !important;
    display: block !important;
}

.powerbi-page {
    max-width: 1600px;
    margin: 0 auto;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text-main);
    background: rgba(255,255,255,0.9);
    border-radius: var(--radius-lg);
}

.powerbi-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
}
.powerbi-header h1 {
    font-size: 26px;
    font-weight: 800;
    color: var(--text-main);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    letter-spacing: -0.5px;
}
.powerbi-header h1 i { color: var(--primary); }

.dashboard-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.dashboard-select {
    padding: 9px 14px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    min-width: 200px;
    background: var(--white);
    color: var(--text-main);
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
}
.dashboard-select:hover { border-color: #cbd5e1; }
.dashboard-select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
}

.dashboard-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border-color);
    background: var(--white);
    color: var(--text-main);
    cursor: pointer;
    transition: var(--transition);
    text-decoration: none;
    box-shadow: var(--shadow-sm);
}
.dashboard-btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: #cbd5e1;
}
.dashboard-btn:active { transform: translateY(0); box-shadow: var(--shadow-sm); }

.dashboard-btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
}
.dashboard-btn.primary:hover { box-shadow: 0 8px 15px var(--primary-light); }

.dashboard-btn.success { 
    background: linear-gradient(135deg, var(--success), #0c6132);
    color: white; 
    border: none; 
}
.dashboard-btn.success:hover { box-shadow: 0 8px 15px rgba(16,124,65,0.2); }

.view-toggle {
    display: flex;
    gap: 4px;
    background: var(--white);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    padding: 4px;
    box-shadow: var(--shadow-sm);
}
.view-btn {
    padding: 8px 16px;
    border: none;
    background: transparent;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition);
}
.view-btn:hover:not(.active) { background: #f1f5f9; color: var(--text-main); }
.view-btn.active {
    background: var(--primary);
    color: white;
    box-shadow: 0 2px 6px var(--primary-light);
}

.live-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 4px 10px;
    background: rgba(255,255,255,0.6);
    border-radius: 20px;
    border: 1px solid var(--border-color);
}
.live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
    box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
}
@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.1); }
}

.filter-panel {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    margin-bottom: 24px;
    transition: var(--transition);
}
.filter-panel:hover { box-shadow: var(--shadow-md); }

.filter-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: flex-end;
}
.filter-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 170px;
    flex: 1;
}
.filter-group label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.filter-group input,
.filter-group select {
    padding: 10px 14px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    background: #f8fafc;
    color: var(--text-main);
    transition: var(--transition);
}
.filter-group input:hover, .filter-group select:hover { background: var(--white); border-color: #cbd5e1; }
.filter-group input:focus, .filter-group select:focus {
    background: var(--white);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
}
.filter-actions {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex: 1;
    min-width: max-content;
}

.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
}
.kpi-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.kpi-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: #cbd5e1;
}
.kpi-card .kpi-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 16px;
    transition: transform 0.3s ease;
}
.kpi-card:hover .kpi-icon { transform: scale(1.05); }

.kpi-card .kpi-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
}
.kpi-card .kpi-value {
    font-size: 32px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.1;
}
.kpi-card .kpi-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 8px;
    font-weight: 500;
}
/* Icon Colors */
.kpi-icon.purple { background: var(--primary-light); color: var(--primary); }
.kpi-icon.green { background: rgba(16,124,65,0.12); color: var(--success); }
.kpi-icon.red { background: rgba(225,37,27,0.12); color: var(--accent-red); }
.kpi-icon.blue { background: rgba(59,130,246,0.12); color: var(--info); }
.kpi-icon.yellow { background: rgba(245,158,11,0.12); color: var(--warning); }

.charts-layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: 380px 380px;
    gap: 20px;
    margin-bottom: 24px;
}
.charts-main { grid-column: 1; grid-row: 1 / 3; }
.charts-side { grid-column: 2; grid-row: 1 / 3; display: flex; flex-direction: column; gap: 20px; }
.charts-bottom { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

.chart-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    height: 100%;
    transition: var(--transition);
}
.chart-card:hover { box-shadow: var(--shadow-md); }
.chart-card .chart-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
    margin: 0 0 20px 0;
    display: flex;
    align-items: center;
    gap: 8px;
}
.chart-wrapper { position: relative; height: 320px; min-height: 0; }
.chart-wrapper canvas { max-height: none; }

/* Main line chart fills the full height of the main area */
.charts-main .chart-card {
    display: flex;
    flex-direction: column;
}
.charts-main .chart-wrapper {
    flex: 1;
    height: auto;
    min-height: 0;
}

/* Unified Table/Pivot Views */
.table-view, .pivot-view {
    background: var(--white);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    overflow: hidden;
    margin-bottom: 24px;
    transition: var(--transition);
}
.table-view:hover, .pivot-view:hover { box-shadow: var(--shadow-md); }

.table-header, .pivot-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fdfdfd;
}
.table-header h3, .pivot-header h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
}
.table-scroll, .pivot-table-wrap {
    overflow-x: auto;
    max-height: 550px;
    overflow-y: auto;
}
.table-view table, .pivot-view table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
.table-view th {
    background: #f8fafc;
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 11.5px;
    letter-spacing: 0.5px;
    padding: 14px 20px;
    text-align: left;
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 1px 0 var(--border-color);
}
.table-view td {
    padding: 12px 20px;
    border-bottom: 1px solid #f1f5f9;
    white-space: nowrap;
    color: var(--text-main);
    transition: background 0.2s ease;
}
.table-view tbody tr:nth-child(even) { background: #fafbfc; }
.table-view tbody tr:hover td { background: var(--primary-light); }

/* Pivot Specifics */
.pivot-controls {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border-color);
    background: #f8fafc;
}
.pivot-control-group label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 4px;
    display: block;
}
.pivot-control-group select {
    padding: 8px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 13px;
    min-width: 140px;
    background: var(--white);
    color: var(--text-main);
    transition: var(--transition);
}
.pivot-control-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); outline: none; }
.pivot-view th {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    font-weight: 600;
    padding: 12px 20px;
    text-align: left;
    font-size: 13px;
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 10;
}
.pivot-view td {
    padding: 10px 20px;
    border-bottom: 1px solid #f1f5f9;
    color: var(--text-main);
}
.pivot-view tbody tr:hover td { background: #f8fafc; }

/* Modals */
.modal-overlay {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(5px);
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-box {
    background: var(--white);
    width: 500px;
    max-width: 94%;
    border-radius: var(--radius-lg);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    overflow: hidden;
    transform: scale(0.95);
    animation: scaleUp 0.2s ease-out forwards;
}
@keyframes scaleUp { to { transform: scale(1); } }

.modal-header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.modal-header h3 { margin: 0; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.modal-close {
    width: 32px;
    height: 32px;
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
}
.modal-close:hover { background: rgba(255,255,255,0.3); }

.modal-body { padding: 24px; }
.modal-field { margin-bottom: 20px; }
.modal-field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 8px;
}
.modal-field input, .modal-field select, .modal-field textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    background: #f8fafc;
    color: var(--text-main);
    transition: var(--transition);
}
.modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus {
    background: var(--white);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
}
.modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border-color);
    background: #f8fafc;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
}

.toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    padding: 16px 24px;
    border-radius: var(--radius-md);
    color: white;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 10px 30px -5px rgba(0,0,0,0.3);
    z-index: 99999;
    display: none;
    max-width: 400px;
    animation: fadeInSlideUp 0.3s ease-out;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--accent-red); }
.toast.warning { background: var(--warning); color: #1e293b; }

/* Card View Styles */
.card-view {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 20px 0;
}
.stat-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-height: 140px;
}
.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: #cbd5e1;
}
.stat-icon {
    font-size: 40px;
    margin-bottom: 16px;
    line-height: 1;
}
.stat-value {
    font-size: 28px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.2;
    margin: 8px 0;
}
.stat-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* =========================================
   Responsive Design & Mobile View
   ========================================= */

/* Tablet & Smaller Laptops */
@media (max-width: 1024px) {
    .charts-layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
    }
    .charts-main, .charts-side {
        grid-column: 1 / -1;
        grid-row: auto;
    }
    .charts-bottom {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* Mobile Devices (Phones) */
@media (max-width: 768px) {
    .powerbi-page {
        padding: 12px;
        margin: 8px;
    }
    
    .powerbi-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }
    
    .dashboard-bar {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }
    
    .dashboard-select {
        grid-column: 1 / -1;
        min-width: 100%;
    }
    
    .live-indicator {
        grid-column: 1 / -1;
        justify-content: center;
        margin-top: 4px;
    }
    
    .dashboard-btn {
        justify-content: center;
        width: 100%;
    }
    
    /* View Toggle adjustments */
    .view-toggle {
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        justify-content: space-between;
    }
    .view-btn {
        flex: 1;
        text-align: center;
        padding: 8px 4px;
        font-size: 12px;
    }
    
    /* Filter Panel Restructuring */
    .filter-panel {
        padding: 16px;
    }
    .filter-row {
        flex-direction: column;
        gap: 12px;
    }
    .filter-group {
        min-width: 100%;
        width: 100%;
    }
    .filter-actions {
        width: 100%;
        margin-top: 8px;
    }
    .filter-actions .dashboard-btn {
        flex: 1;
    }

    /* KPIs to 2-column or 1-column grid */
    .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
    .kpi-card {
        padding: 16px;
    }
    .kpi-card .kpi-value {
        font-size: 24px;
    }
    .kpi-card .kpi-icon {
        width: 36px;
        height: 36px;
        font-size: 16px;
        margin-bottom: 12px;
    }

    /* Charts single column */
    .charts-bottom {
        grid-template-columns: 1fr;
    }
    .chart-wrapper {
        height: 300px;
    }
    /* Main chart gets a fixed height on mobile since flex won't have a defined parent height */
    .charts-main .chart-wrapper {
        height: 300px;
        flex: none;
    }

    /* Modals & Overlays */
    .modal-box {
        max-width: 90%;
        width: 100%;
        margin: 20px;
        max-height: 90vh;
        overflow-y: auto;
    }
    
    /* Pivot controls stacked */
    .pivot-controls {
        flex-direction: column;
        gap: 12px;
    }
    .pivot-control-group {
        width: 100%;
    }
    .pivot-control-group select {
        width: 100%;
    }
    
    /* Ensure table scroll doesn't break page */
    .table-scroll, .pivot-table-wrap {
        max-height: 60vh;
    }
    
    /* Card view adjustments */
    .card-view {
        grid-template-columns: 1fr;
    }
}

/* Extra Small Phones */
@media (max-width: 480px) {
    .kpi-grid {
        grid-template-columns: 1fr;
    }
}
</style>

<!-- Pass JSON data to JavaScript (pre-serialized with DjangoJSONEncoder) -->
<script id="kpi-data" type="application/json">{{ json_kpi_data|safe }}</script>
<script id="chart-data" type="application/json">{{ json_chart_data|safe }}</script>
<script id="table-data" type="application/json">{{ json_table_data|safe }}</script>
<script id="table-config" type="application/json">{{ json_table_config|safe }}</script>
<script id="pivot-data" type="application/json">{{ json_pivot_data|safe }}</script>
<script id="pivot-config" type="application/json">{{ json_pivot_config|safe }}</script>

<!-- Everything below this point remains exactly the same to preserve functionality -->
<div class="powerbi-page">
    <div id="toast" class="toast"></div>

    <div class="powerbi-header">
        <h1><i class="fa-solid fa-chart-pie"></i> Power BI Dashboard</h1>
        <div class="dashboard-bar">
            <select id="dashboardSelect" class="dashboard-select" onchange="loadDashboard(this.value)">
                <option value="">-- Select Dashboard --</option>
                {% for d in user_dashboards %}
                <option value="{{ d.id }}" {% if d.is_default %}selected{% endif %}>{{ d.name }}</option>
                {% endfor %}
            </select>
            <button class="dashboard-btn primary" onclick="showSaveModal()"><i class="fa-solid fa-floppy-disk"></i> Save</button>
            <button class="dashboard-btn success" onclick="showNewModal()"><i class="fa-solid fa-plus"></i> New</button>
            <button class="dashboard-btn" onclick="deleteCurrentDashboard()"><i class="fa-solid fa-trash"></i></button>
            <button class="dashboard-btn" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>

<script>
// JS is preserved exactly as provided

        ]
    },
    planning: {
        kpiFields: [
            { key: 'total_planned', label: 'Total Planned', icon: 'fa-clipboard-list', color: 'purple', sub: null },

            { key: 'completion_rate', label: 'Completion Rate', icon: 'fa-percent', color: 'blue', sub: null },
            { key: 'pending_plans', label: 'Pending Plans', icon: 'fa-clock', color: 'yellow', sub: null }
        ]
    },

    },

            { key: 'low_stock', label: 'Low Stock Alerts', icon: 'fa-triangle-exclamation', color: 'red', sub: null },

            { key: 'total_challans', label: 'Challans', icon: 'fa-file-invoice', color: 'purple', sub: null },
            { key: 'total_dispatched', label: 'Total Qty', icon: 'fa-truck', color: 'green', sub: null },
            { key: 'total_amount', label: 'Total Amount', icon: 'fa-indian-rupee-sign', color: 'blue', sub: null },

        ]
    },

        kpiFields: [
            { key: 'total_scrap_qty', label: 'Total Scrap Qty', icon: 'fa-trash', color: 'red', sub: 'total_scrap_weight' },
            { key: 'side_patti', label: 'Side Patti', icon: 'fa-square', color: 'blue', sub: null },
            { key: 'line_setting', label: 'Line Setting', icon: 'fa-sliders', color: 'yellow', sub: null },
            { key: 'rejected', label: 'Rejected', icon: 'fa-ban', color: 'red', sub: null }
        ]
    },
    weight_sheet: {
        kpiFields: [
            { key: 'total_sheets', label: 'Weight Sheets', icon: 'fa-file-lines', color: 'purple', sub: null },
            { key: 'total_weight', label: 'Total Weight', icon: 'fa-weight-hanging', color: 'green', sub: null },
            { key: 'total_excess', label: 'Total Excess', icon: 'fa-arrow-trend-up', color: 'red', sub: null },
            { key: 'avg_excess_pct', label: 'Avg Excess %', icon: 'fa-percent', color: 'yellow', sub: null }
        ]
    },
    unfinished: {
        kpiFields: [
            { key: 'total_qty', label: 'Unfinished Qty', icon: 'fa-circle-half-stroke', color: 'warning', sub: null },
            { key: 'total_items', label: 'Total Items', icon: 'fa-list', color: 'purple', sub: null },
            { key: 'unique_products', label: 'Products', icon: 'fa-box', color: 'blue', sub: null },
            { key: 'today_unfinished', label: "Today's", icon: 'fa-calendar-day', color: 'green', sub: null }
        ]
    }
};

let charts = {};
let refreshTimer = null;
let currentDashboardId = null;

function updateLastUpdate() {
    document.getElementById('lastUpdate').textContent = 'Updated: ' + new Date().toLocaleTimeString();
}

function renderKPIs(kpiData) {
    const reportType = document.getElementById('reportTypeInput').value;
    const config = reportTypeConfigs[reportType];
    const grid = document.getElementById('kpiGrid');
    grid.innerHTML = '';
    if (!config || !kpiData) return;
    config.kpiFields.forEach(field => {
        const value = kpiData[field.key] !== undefined ? kpiData[field.key] : '-';
        grid.innerHTML += `
            <div class="kpi-card">
                <div class="kpi-icon ${field.color}"><i class="fa-solid ${field.icon}"></i></div>
                <div class="kpi-label">${field.label}</div>
                <div class="kpi-value">${value}</div>
            </div>
        `;
    });
}

// Safe JSON data getters using Django's json_script
function getKPIData() {
    const el = document.getElementById('kpi-data');
    return el ? JSON.parse(el.textContent) : {};
}

function getChartData() {
    const el = document.getElementById('chart-data');
    return el ? JSON.parse(el.textContent) : {};
}

function getTableData() {
    const el = document.getElementById('table-data');
    const data = el ? JSON.parse(el.textContent) : [];
    return Array.isArray(data) ? data : [];
}

function getTableConfig() {
    const el = document.getElementById('table-config');
    return el ? JSON.parse(el.textContent) : { headers: [], keys: [] };
}

function getPivotData() {
    const el = document.getElementById('pivot-data');
    const data = el ? JSON.parse(el.textContent) : [];
    return Array.isArray(data) ? data : [];
}

function getPivotConfig() {
    const el = document.getElementById('pivot-config');
    return el ? JSON.parse(el.textContent) : { rows: [], cols: [], values: [], agg: [] };
}

function renderCharts(chartData) {
    const reportType = document.getElementById('reportTypeInput').value;
    const mainContainer = document.getElementById('chartsMain');
    const sideContainer = document.getElementById('chartsSide');
    const bottomContainer = document.getElementById('chartsBottom');
    
    if (!mainContainer || !sideContainer || !bottomContainer) return;
    
    mainContainer.innerHTML = '';
    sideContainer.innerHTML = '';
    bottomContainer.innerHTML = '';
    
    Object.values(charts).forEach(c => { if (c) c.destroy(); });
    charts = {};

    const chartDefinitions = [];
    if (reportType === 'production') {
        chartDefinitions.push(
            { id: 'trendChart', type: 'line', title: 'Production Trend', icon: 'fa-chart-line', color: 'var(--primary)', area: 'main', data: () => ({
                labels: chartData.trend && chartData.trend.labels ? chartData.trend.labels : [],
                datasets: [
                    { label: 'Qty', data: chartData.trend && chartData.trend.qty ? chartData.trend.qty : [], borderColor: '#3F2E97', backgroundColor: 'rgba(63,46,151,0.1)', fill: true, tension: 0.4, yAxisID: 'y' },
                    { label: 'Weight (kg)', data: chartData.trend && chartData.trend.weight ? chartData.trend.weight : [], borderColor: '#107C41', backgroundColor: 'rgba(16,124,65,0.1)', fill: true, tension: 0.4, yAxisID: 'y1' }
                ]
            })},
            { id: 'categoryChart', type: 'doughnut', title: 'Category Distribution', icon: 'fa-chart-pie', color: 'var(--success)', area: 'side', data: () => ({
                labels: chartData.category && chartData.category.labels ? chartData.category.labels : [],
                datasets: [{ data: chartData.category && chartData.category.values ? chartData.category.values : [], backgroundColor: ['#3F2E97', '#107C41', '#F59E0B', '#3B82F6', '#E1251B'], borderWidth: 0 }]
            })},
            { id: 'machineChart', type: 'bar', title: 'Machine Performance (kg)', icon: 'fa-chart-bar', color: 'var(--info)', area: 'side', isHorizontal: true, data: () => ({
                labels: chartData.machine && chartData.machine.labels ? chartData.machine.labels : [],
                datasets: [{ label: 'Weight (kg)', data: chartData.machine && chartData.machine.values ? chartData.machine.values : [], backgroundColor: 'rgba(59,130,246,0.7)', borderColor: 'rgba(59,130,246,1)', borderWidth: 1, borderRadius: 4 }]
            })},
            { id: 'shiftChart', type: 'bar', title: 'Shift Comparison', icon: 'fa-chart-simple', color: 'var(--warning)', area: 'bottom', data: () => ({
                labels: ['Day', 'Night'],
                datasets: [
                    { label: 'Qty', data: [chartData.shift && chartData.shift.day_qty ? chartData.shift.day_qty : 0, chartData.shift && chartData.shift.night_qty ? chartData.shift.night_qty : 0], backgroundColor: ['rgba(245,158,11,0.7)', 'rgba(30,58,95,0.7)'], borderRadius: 4 },
                    { label: 'Weight (kg)', data: [chartData.shift && chartData.shift.day_weight ? chartData.shift.day_weight : 0, chartData.shift && chartData.shift.night_weight ? chartData.shift.night_weight : 0], backgroundColor: ['rgba(245,158,11,0.3)', 'rgba(30,58,95,0.3)'], borderRadius: 4 }
                ]
            })},
            { id: 'operatorChart', type: 'bar', title: 'Operator Leaderboard', icon: 'fa-ranking-star', color: 'var(--success)', area: 'bottom', isHorizontal: true, data: () => ({
                labels: chartData.operator && chartData.operator.labels ? chartData.operator.labels : [],
                datasets: [{ label: 'Weight (kg)', data: chartData.operator && chartData.operator.values ? chartData.operator.values : [], backgroundColor: 'rgba(16,124,65,0.7)', borderColor: 'rgba(16,124,65,1)', borderWidth: 1, borderRadius: 4 }]
            })},
            { id: 'scrapChart', type: 'doughnut', title: 'Scrap Analysis', icon: 'fa-dumpster', color: 'var(--accent-red)', area: 'bottom', data: () => ({
                labels: ['Side Patti', 'Line Setting', 'Rejected'],
                datasets: [{ data: [chartData.scrap && chartData.scrap.sidepatti ? chartData.scrap.sidepatti : 0, chartData.scrap && chartData.scrap.linesetting ? chartData.scrap.linesetting : 0, chartData.scrap && chartData.scrap.rejected ? chartData.scrap.rejected : 0], backgroundColor: ['#3B82F6', '#F59E0B', '#E1251B'], borderWidth: 0 }]
            })}
        );
    } else {
        chartDefinitions.push(
            { id: 'trendChart', type: 'line', title: 'Trend', icon: 'fa-chart-line', color: 'var(--primary)', area: 'main', data: () => ({
                labels: chartData.trend && chartData.trend.labels ? chartData.trend.labels : [],
                datasets: [{ label: 'Value', data: chartData.trend && chartData.trend.values ? chartData.trend.values : [], borderColor: '#3F2E97', backgroundColor: 'rgba(63,46,151,0.1)', fill: true, tension: 0.4 }]
            })},
            { id: 'categoryChart', type: 'doughnut', title: 'Distribution', icon: 'fa-chart-pie', color: 'var(--success)', area: 'side', data: () => ({
                labels: chartData.category && chartData.category.labels ? chartData.category.labels : [],
                datasets: [{ data: chartData.category && chartData.category.values ? chartData.category.values : [], backgroundColor: ['#3F2E97', '#107C41', '#F59E0B', '#3B82F6'], borderWidth: 0 }]
            })},
            { id: 'machineChart', type: 'bar', title: 'By Machine', icon: 'fa-chart-bar', color: 'var(--info)', area: 'bottom', isHorizontal: true, data: () => ({
                labels: chartData.machine && chartData.machine.labels ? chartData.machine.labels : [],
                datasets: [{ label: 'Value', data: chartData.machine && chartData.machine.values ? chartData.machine.values : [], backgroundColor: 'rgba(59,130,246,0.7)', borderRadius: 4 }]
            })}
        );
    }

    chartDefinitions.forEach(def => {
        let container;
        if (def.area === 'main') container = mainContainer;
        else if (def.area === 'side') container = sideContainer;
        else container = bottomContainer;

        const card = document.createElement('div');
        card.className = 'chart-card';
        card.innerHTML = `
            <h3 class="chart-title"><i class="fa-solid ${def.icon}" style="color:${def.color};"></i> ${def.title}</h3>
            <div class="chart-wrapper"><canvas id="${def.id}"></canvas></div>
        `;
        container.appendChild(card);
        const ctx = document.getElementById(def.id).getContext('2d');
        const chartDataObj = def.data();
        charts[def.id] = new Chart(ctx, {
            type: def.type,
            data: chartDataObj,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } } },
                scales: def.type === 'bar' && !def.isHorizontal ? { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } } } : undefined,
                indexAxis: def.isHorizontal ? 'y' : undefined
            }
        });
    });
}

function renderTable() {
    const tbody = document.getElementById('tableBody');
    const thead = document.getElementById('tableHead');
    tbody.innerHTML = '';
    const tableConfig = getTableConfig();
    const tableData = getTableData();
    if (tableConfig && tableConfig.headers) {
        let headerHtml = '<tr>';
        tableConfig.headers.forEach(h => { headerHtml += `<th>${h}</th>`; });
        headerHtml += '</tr>';
        thead.innerHTML = headerHtml;
        tableData.forEach((row, i) => {
            let rowHtml = `<tr><td>${i + 1}</td>`;
            tableConfig.keys.forEach(key => {
                const val = row[key] !== undefined ? row[key] : '-';
                if (typeof val === 'number') {
                    rowHtml += `<td class="num-col">${Number(val).toFixed(2)}</td>`;
                } else {
                    rowHtml += `<td>${val}</td>`;
                }
            });
            rowHtml += '</tr>';
            tbody.innerHTML += rowHtml;
        });
    }
}

function renderPivot() {
    const pivotData = getPivotData();
    const pivotConfig = getPivotConfig();
    const rowsField = document.getElementById('pivotRows').value;
    const colsField = document.getElementById('pivotCols').value;
    const valueField = document.getElementById('pivotValue').value;
    const aggType = document.getElementById('pivotAgg').value;

    if (document.getElementById('pivotRows').options.length === 0 && pivotConfig && pivotConfig.rows) {
        pivotConfig.rows.forEach(v => { document.getElementById('pivotRows').add(new Option(v, v)); });
        pivotConfig.cols.forEach(v => { document.getElementById('pivotCols').add(new Option(v, v)); });
        pivotConfig.values.forEach(v => { document.getElementById('pivotValue').add(new Option(v, v)); });
        if (pivotConfig.agg) {
            const aggSelect = document.getElementById('pivotAgg');
            aggSelect.innerHTML = '';
            pivotConfig.agg.forEach(a => { aggSelect.add(new Option(a.charAt(0).toUpperCase() + a.slice(1), a)); });
        }
        if (pivotConfig.rows.length) document.getElementById('pivotRows').value = pivotConfig.rows[0];
        if (pivotConfig.cols.length) document.getElementById('pivotCols').value = pivotConfig.cols[0];
        if (pivotConfig.values.length) document.getElementById('pivotValue').value = pivotConfig.values[0];
    }

    const groups = {};
    pivotData.forEach(d => {
        const rowKey = d[rowsField] || 'Unknown';
        const colKey = d[colsField] || 'Unknown';
        const val = parseFloat(d[valueField]) || 0;
        if (!groups[rowKey]) groups[rowKey] = {};
        if (!groups[rowKey][colKey]) groups[rowKey][colKey] = [];
        groups[rowKey][colKey].push(val);
    });

    const colKeys = new Set();
    Object.values(groups).forEach(rows => Object.keys(rows).forEach(k => colKeys.add(k)));
    const sortedCols = Array.from(colKeys).sort();

    function aggregate(vals) {
        if (vals.length === 0) return 0;
        switch (aggType) {
            case 'sum': return vals.reduce((a, b) => a + b, 0);
            case 'avg': return vals.reduce((a, b) => a + b, 0) / vals.length;
            case 'count': return vals.length;
            case 'min': return Math.min(...vals);
            case 'max': return Math.max(...vals);
            default: return vals.reduce((a, b) => a + b, 0);
        }
    }

    let html = '<thead><tr><th>' + rowsField + '</th>';
    sortedCols.forEach(c => { html += '<th>' + c + '</th>'; });
    html += '<th>Total</th></tr></thead><tbody>';

    Object.keys(groups).sort().forEach(rowKey => {
        html += '<tr><td><strong>' + rowKey + '</strong></td>';
        let rowTotal = 0;
        sortedCols.forEach(colKey => {
            const vals = groups[rowKey][colKey] || [];
            const val = aggregate(vals);
            rowTotal += val;
            html += '<td class="num-col">' + val.toFixed(2) + '</td>';
        });
        html += '<td class="num-col" style="font-weight:700;color:var(--primary);">' + rowTotal.toFixed(2) + '</td></tr>';
    });

    html += '<tr style="background:#FAF9FE;font-weight:700;"><td>GRAND TOTAL</td>';
    let grandTotal = 0;
    sortedCols.forEach(colKey => {
        let colTotal = 0;
        Object.keys(groups).forEach(rowKey => {
            const vals = groups[rowKey][colKey] || [];
            colTotal += aggregate(vals);
        });
        grandTotal += colTotal;
        html += '<td class="num-col" style="color:var(--primary);">' + colTotal.toFixed(2) + '</td>';
    });
    html += '<td class="num-col" style="color:var(--primary);">' + grandTotal.toFixed(2) + '</td></tr>';
    html += '</tbody>';

    document.getElementById('pivotTable').innerHTML = html;
}

function renderCards() {
    const grid = document.getElementById('cardGrid');
    const pivotData = getPivotData();
    const tableData = getTableData();
    grid.innerHTML = '';
    const data = pivotData.length > 0 ? pivotData : tableData;
    if (data.length === 0) return;
        const fields = Object.keys(data[0]).filter(k => k !== '#' && k !== 'No.');
    fields.slice(0, 6).forEach(field => {
        const values = data.map(d => parseFloat(d[field]) || 0);
        const sum = values.reduce((a, b) => a + b, 0);
        grid.innerHTML += `
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-chart-simple"></i></div>
                <div class="stat-value">${sum.toFixed(2)}</div>
                <div class="stat-label">${field} (Total)</div>
            </div>
        `;
    });
}

function switchView(view) {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.view-btn[onclick*="${view}"]`).classList.add('active');
    document.getElementById('viewInput').value = view;
    document.getElementById('chartView').style.display = view === 'chart' ? 'block' : 'none';
    document.getElementById('tableView').style.display = view === 'table' ? 'block' : 'none';
    document.getElementById('pivotView').style.display = view === 'pivot' ? 'block' : 'none';
    document.getElementById('cardView').style.display = view === 'card' ? 'block' : 'none';
    if (view === 'chart') {
        requestAnimationFrame(() => {
            Object.values(charts).forEach(c => c && c.resize());
        });
    }
}

function resetFilters() {
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = '';
    document.getElementById('shiftFilter').value = '';
    document.getElementById('categoryFilter').value = '';
    document.getElementById('operatorFilter').value = '';
    document.querySelectorAll('#machineFilter option').forEach(o => o.selected = false);
    document.getElementById('filterForm').submit();
}

function showSaveModal() {
    const sel = document.getElementById('dashboardSelect');
    document.getElementById('dashName').value = sel.options[sel.selectedIndex]?.text || 'My Dashboard';
    document.getElementById('dashDesc').value = '';
    document.getElementById('dashFormat').value = document.getElementById('viewInput').value;
    document.getElementById('dashRefresh').value = document.getElementById('refreshInterval').value;
    document.getElementById('dashDefault').checked = false;
    document.getElementById('saveModal').style.display = 'flex';
}

function showNewModal() {
    document.getElementById('newDashName').value = '';
    document.getElementById('newDashDesc').value = '';
    document.getElementById('newModal').style.display = 'flex';
}

function closeModal(id) {
    document.getElementById(id).style.display = 'none';
}

function saveDashboard() {
    const data = {
        name: document.getElementById('dashName').value,
        description: document.getElementById('dashDesc').value,
        default_format: document.getElementById('dashFormat').value,
        auto_refresh_interval: parseInt(document.getElementById('dashRefresh').value),
        is_default: document.getElementById('dashDefault').checked,
        layout_config: {},
        filters_config: {
            from_date: document.getElementById('fromDate').value,
            to_date: document.getElementById('toDate').value,
            machine: Array.from(document.getElementById('machineFilter').selectedOptions).map(o => o.value),
            shift: document.getElementById('shiftFilter').value,
            category: document.getElementById('categoryFilter').value,
            operator: document.getElementById('operatorFilter').value,
        },
        pivot_config: {
            rows: document.getElementById('pivotRows').value,
            cols: document.getElementById('pivotCols').value,
            value: document.getElementById('pivotValue').value,
            agg: document.getElementById('pivotAgg').value
        }
    };
    const sel = document.getElementById('dashboardSelect');
    if (sel.value) data.id = parseInt(sel.value);
    fetch('{% url "save_dashboard" %}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            showToast('Dashboard saved: ' + res.dashboard.name, 'success');
            closeModal('saveModal');
            loadDashboardList();
        } else {
            showToast('Error: ' + (res.error || 'Unknown'), 'error');
        }
    })
    .catch(e => showToast('Error saving dashboard', 'error'));
}

function createNewDashboard() {
    const name = document.getElementById('newDashName').value;
    if (!name) { showToast('Please enter a dashboard name', 'warning'); return; }
    fetch('{% url "save_dashboard" %}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
        body: JSON.stringify({ name: name, description: document.getElementById('newDashDesc').value })
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            showToast('Dashboard created: ' + res.dashboard.name, 'success');
            closeModal('newModal');
            loadDashboardList();
        } else {
            showToast('Error: ' + (res.error || 'Unknown'), 'error');
        }
    });
}

function loadDashboard(id) {
    if (!id) return;
    currentDashboardId = id;
    fetch(`{% url "load_dashboard" 99999 %}`.replace('99999', id))
    .then(r => r.json())
    .then(dash => {
        if (dash.error) { showToast(dash.error, 'error'); return; }
        if (dash.filters_config) {
            if (dash.filters_config.from_date) document.getElementById('fromDate').value = dash.filters_config.from_date;
            if (dash.filters_config.to_date) document.getElementById('toDate').value = dash.filters_config.to_date;
            if (dash.filters_config.shift) document.getElementById('shiftFilter').value = dash.filters_config.shift;
            if (dash.filters_config.category) document.getElementById('categoryFilter').value = dash.filters_config.category;
        }
        if (dash.pivot_config) {
            if (dash.pivot_config.rows) document.getElementById('pivotRows').value = dash.pivot_config.rows;
            if (dash.pivot_config.cols) document.getElementById('pivotCols').value = dash.pivot_config.cols;
            if (dash.pivot_config.value) document.getElementById('pivotValue').value = dash.pivot_config.value;
            if (dash.pivot_config.agg) document.getElementById('pivotAgg').value = dash.pivot_config.agg;
            renderPivot();
        }
        if (dash.default_format) {
            switchView(dash.default_format);
            document.getElementById('viewInput').value = dash.default_format;
        }
        if (dash.auto_refresh_interval > 0) {
            document.getElementById('refreshInterval').value = dash.auto_refresh_interval;
            setAutoRefresh(dash.auto_refresh_interval);
        }
        showToast('Loaded: ' + dash.name, 'success');
    });
}

function loadDashboardList() {
    fetch('{% url "list_dashboards" %}')
    .then(r => r.json())
    .then(res => {
        const sel = document.getElementById('dashboardSelect');
        sel.innerHTML = '<option value="">-- Select Dashboard --</option>';
        res.dashboards.forEach(d => {
            sel.innerHTML += `<option value="${d.id}" ${d.is_default ? 'selected' : ''}>${d.name}</option>`;
        });
    });
}

function deleteCurrentDashboard() {
    const sel = document.getElementById('dashboardSelect');
    if (!sel.value) { showToast('No dashboard selected', 'warning'); return; }
    if (!confirm('Delete this dashboard permanently?')) return;
    fetch(`{% url "delete_dashboard" 99999 %}`.replace('99999', sel.value), {
        method: 'POST',
        headers: { 'X-CSRFToken': '{{ csrf_token }}' }
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            showToast('Dashboard deleted', 'success');
            sel.value = '';
            loadDashboardList();
        } else {
            showToast('Error deleting dashboard', 'error');
        }
    });
}

function setAutoRefresh(seconds) {
    if (refreshTimer) clearInterval(refreshTimer);
    if (parseInt(seconds) > 0) {
        refreshTimer = setInterval(refreshData, parseInt(seconds) * 1000);
        document.getElementById('liveLabel').textContent = 'Auto-refresh ' + seconds + 's';
    } else {
        document.getElementById('liveLabel').textContent = 'Manual';
    }
}

function refreshData() {
    const params = new URLSearchParams();
    params.append('from_date', document.getElementById('fromDate').value);
    params.append('to_date', document.getElementById('toDate').value);
    params.append('shift', document.getElementById('shiftFilter').value);
    params.append('category', document.getElementById('categoryFilter').value);
    params.append('operator', document.getElementById('operatorFilter').value);
    Array.from(document.getElementById('machineFilter').selectedOptions).forEach(o => params.append('machine', o.value));
    fetch('{% url "power_bi_data" %}?' + params.toString())
    .then(r => r.json())
    .then(data => {
        if (data.error) { showToast(data.error, 'error'); return; }
        renderKPIs(data.kpis || {});
        renderCharts(data.charts || {});
        window.currentTableData = data.table_data || [];
        window.currentPivotData = data.pivot_data || [];
        renderTable();
        renderPivot();
        renderCards();
        updateLastUpdate();
        showToast('Data refreshed successfully', 'success');
    })
    .catch(e => showToast('Error refreshing data', 'error'));
}

function exportChart(chartId) {
    const canvas = document.getElementById(chartId);
    if (!canvas) return;
    const link = document.createElement('a');
    link.download = chartId + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

function exportTableToCSV() {
    const tableData = getTableData();
    let csv = '';
    const headers = getTableConfig().headers || [];
    csv += headers.join(',') + '\n';
    tableData.forEach(r => {
        const row = headers.map(h => {
            const key = getDataKey(h);
            const val = r[key] !== undefined ? r[key] : '';
            return '"' + String(val).replace(/"/g, '""') + '"';
        });
        csv += row.join(',') + '\n';
    });
    downloadFile(csv, 'report_data.csv', 'text/csv');
}

function exportTableToExcel() {
    const tableData = getTableData();
    let html = '<table><tr>';
    const headers = getTableConfig().headers || [];
    headers.forEach(h => { html += '<th>' + h + '</th>'; });
    html += '</tr>';
    tableData.forEach(r => {
        headers.forEach(h => {
            const key = getDataKey(h);
            html += '<td>' + (r[key] !== undefined ? r[key] : '') + '</td>';
        });
        html += '</tr>';
    });
    html += '</table>';
    downloadFile(html, 'report_data.xls', 'application/vnd.ms-excel');
}

function exportPivotToCSV() {
    const table = document.getElementById('pivotTable');
    let csv = '';
    table.querySelectorAll('tr').forEach(tr => {
        const row = [];
        tr.querySelectorAll('th, td').forEach(td => row.push('"' + td.textContent.trim().replace(/"/g, '""') + '"'));
        csv += row.join(',') + '\n';
    });
    downloadFile(csv, 'pivot_data.csv', 'text/csv');
}

function exportPivotToExcel() {
    const tableHtml = document.getElementById('pivotTable').outerHTML;
    downloadFile(tableHtml, 'pivot_data.xls', 'application/vnd.ms-excel');
}

function downloadFile(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
    URL.revokeObjectURL(link.href);
}

function showToast(message, type) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast ' + type;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
    });
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
    }
});

function onReportTypeChange() {
    const select = document.getElementById('reportTypeFilter');
    const hiddenInput = document.getElementById('reportTypeInput');
    hiddenInput.value = select.value;
    document.getElementById('filterForm').submit();
}

// ResizeObserver to keep charts properly sized when containers change
let chartResizeObserver = null;
function setupChartResizeObserver() {
    if (chartResizeObserver) chartResizeObserver.disconnect();
    const layout = document.querySelector('.charts-layout');
    if (!layout) return;
    chartResizeObserver = new ResizeObserver(() => {
        requestAnimationFrame(() => {
            Object.values(charts).forEach(c => c && c.resize());
        });
    });
    chartResizeObserver.observe(layout);
}

document.addEventListener('DOMContentLoaded', function() {
    try {
        window.currentTableData = getTableData();
        window.currentPivotData = getPivotData();
        const kpiData = getKPIData();
        const chartData = getChartData();
        console.log('Initializing dashboard, report type:', document.getElementById('reportTypeInput').value);
        renderKPIs(kpiData);
        // Delay chart rendering until layout is fully settled to prevent sizing glitches
        requestAnimationFrame(() => {
            renderCharts(chartData);
            setupChartResizeObserver();
        });
        renderTable();
        renderPivot();
        renderCards();
        updateLastUpdate();
        const sel = document.getElementById('dashboardSelect');
        if (sel.value) loadDashboard(sel.value);
        console.log('Dashboard initialized');
    } catch (error) {
        console.error('Dashboard init error:', error);
        showToast('Error loading dashboard: ' + error.message, 'error');
    }
});
